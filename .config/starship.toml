"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$nodejs\
$erlang\
$php\
$bun\
$elixir\
$docker\
$cmd_duration\
$line_break\ 
$python\
$character"""


[character]
success_symbol = "[](white)"
error_symbol = "[󰀶](red)"
vimcmd_symbol = "[](green)"
format = "$symbol ┇(white) "

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "bold cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡ "


[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[custom.react]
command = "node -p \"require('./node_modules/react/package.json').version\""
when = "test -f node_modules/react/package.json"
detect_files = ["package.json"]
symbol = " "
style = "bold cyan"
format = "via [$symbol($output )]($style)"

